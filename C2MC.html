<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>C2 Magdalena Contreras · Centro de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #0F172A; color: #F1F5F9; font-family: 'Inter', sans-serif; }
        #map { height: 400px; width: 100%; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .glass { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="p-6">

    <header class="mb-8">
        <h1 class="text-2xl font-bold text-white">Centro de Control de Postes</h1>
        <p class="text-slate-400">Datos precargados de infraestructura</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Mapa -->
        <div class="lg:col-span-2 glass p-4 rounded-2xl">
            <h2 class="text-lg font-semibold mb-4">Ubicación de Postes</h2>
            <div id="map"></div>
        </div>

        <!-- Estadísticas -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="text-lg font-semibold mb-4">Resumen</h2>
            <div class="space-y-4">
                <div><p class="text-sm text-slate-400">Total Postes</p><p class="text-3xl font-bold" id="totalPostes">-</p></div>
                <div><p class="text-sm text-slate-400">Avance Promedio</p><p class="text-3xl font-bold text-emerald-400" id="avgProgreso">-</p></div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="glass p-6 rounded-2xl mt-6">
        <table class="w-full text-left">
            <thead class="text-slate-400 uppercase text-xs border-b border-slate-700">
                <tr><th class="p-4">Poste</th><th class="p-4">Dirección</th><th class="p-4">Progreso</th></tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
        </table>
    </div>

    <script>
        // Datos integrados directamente
        const data = [
            {"id": 1, "direccion": "Aztecas 46, San Bernabé Ocotepec...", "coordenadas": "19.3171, -99.2621", "progreso": 75, "poste": "0032"},
            {"id": 2, "direccion": "Progreso 21, San Nicolás Totolapan...", "coordenadas": "19.3002, -99.2413", "progreso": 75, "poste": "0016"},
            {"id": 3, "direccion": "Luis Echeverría Álvarez MZ37LT14...", "coordenadas": "19.3249, -99.2468", "progreso": 50, "poste": "0045"}
            // ... (resto de tu dataset)
        ];

        // Inicializar Mapa
        const map = L.map('map').setView([19.317, -99.24], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        // Renderizar puntos
        data.forEach(item => {
            const [lat, lng] = item.coordenadas.split(',').map(Number);
            if(lat && lng) {
                L.marker([lat, lng]).addTo(map).bindPopup(`Poste: ${item.poste}<br>${item.direccion}`);
            }
        });

        // Llenar tabla y stats
        const tbody = document.getElementById('tableBody');
        let totalProgreso = 0;
        data.forEach(item => {
            totalProgreso += item.progreso;
            tbody.innerHTML += `<tr><td class="p-4 font-mono text-blue-400">${item.poste}</td><td class="p-4 text-sm">${item.direccion}</td><td class="p-4">${item.progreso}%</td></tr>`;
        });
        
        document.getElementById('totalPostes').textContent = data.length;
        document.getElementById('avgProgreso').textContent = Math.round(totalProgreso/data.length) + "%";
    </script>
</body>
</html>
