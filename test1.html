<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2 Magdalena Contreras · Centro de Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* --- TUS ESTILOS ORIGINALES --- */
:root { --electric: #2563EB; --cyan: #06B6D4; --emerald: #10B981; --purple: #8B5CF6; --orange: #F97316; --yellow: #FACC15; --coral: #EF4444; --bg: #0F172A; --surface: rgba(30,41,59,0.7); --glass: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); --text: #F1F5F9; --muted: #94A3B8; --mono: 'JetBrains Mono', monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #111827 100%); background-attachment: fixed; color: var(--text); min-height: 100vh; overflow-x: hidden; }
.bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; }
.orb-1 { width: 600px; height: 600px; background: #2563EB; top: -200px; left: -200px; }
.orb-2 { width: 500px; height: 500px; background: #8B5CF6; bottom: -100px; right: -100px; }
.orb-3 { width: 400px; height: 400px; background: #06B6D4; top: 40%; left: 50%; transform: translateX(-50%); }
.glass { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); }
.kpi-card { position: relative; overflow: hidden; border-radius: 20px; padding: 24px; cursor: default; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease; animation: cardIn 0.6s ease both; }
.kpi-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity 0.3s ease; background: rgba(255,255,255,0.05); }
.kpi-card:hover { transform: translateY(-6px) scale(1.01); }
.kpi-card:hover::before { opacity: 1; }
.kpi-blue { background: linear-gradient(135deg, rgba(37,99,235,0.25) 0%, rgba(37,99,235,0.08) 100%); border: 1px solid rgba(37,99,235,0.3); box-shadow: 0 8px 32px rgba(37,99,235,0.2); }
.kpi-emerald { background: linear-gradient(135deg, rgba(16,185,129,0.25) 0%, rgba(16,185,129,0.08) 100%); border: 1px solid rgba(16,185,129,0.3); box-shadow: 0 8px 32px rgba(16,185,129,0.2); }
.kpi-purple { background: linear-gradient(135deg, rgba(139,92,246,0.25) 0%, rgba(139,92,246,0.08) 100%); border: 1px solid rgba(139,92,246,0.3); box-shadow: 0 8px 32px rgba(139,92,246,0.2); }
.kpi-orange { background: linear-gradient(135deg, rgba(249,115,22,0.25) 0%, rgba(249,115,22,0.08) 100%); border: 1px solid rgba(249,115,22,0.3); box-shadow: 0 8px 32px rgba(249,115,22,0.2); }
.kpi-glow { position: absolute; width: 140px; height: 140px; border-radius: 50%; filter: blur(40px); opacity: 0.2; transition: opacity 0.3s ease; top: -30px; right: -30px; }
.kpi-blue .kpi-glow { background: #2563EB; }
.kpi-emerald .kpi-glow { background: #10B981; }
.kpi-purple .kpi-glow { background: #8B5CF6; }
.kpi-orange .kpi-glow { background: #F97316; }
.kpi-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; position: relative; z-index: 1; }
.kpi-blue .kpi-icon { background: rgba(37,99,235,0.3); }
.kpi-emerald .kpi-icon { background: rgba(16,185,129,0.3); }
.kpi-purple .kpi-icon { background: rgba(139,92,246,0.3); }
.kpi-orange .kpi-icon { background: rgba(249,115,22,0.3); }
.kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700; line-height: 1; position: relative; z-index: 1; letter-spacing: -1px; }
.kpi-blue .kpi-value { color: #60A5FA; }
.kpi-emerald .kpi-value { color: #34D399; }
.kpi-purple .kpi-value { color: #A78BFA; }
.kpi-orange .kpi-value { color: #FB923C; }
.kpi-label { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; position: relative; z-index: 1; }
.kpi-sub { font-size: 13px; color: var(--muted); position: relative; z-index: 1; margin-top: 10px; }
.pbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 12px; position: relative; z-index: 1; }
.pbar-fill { height: 100%; border-radius: 999px; transition: width 1.2s cubic-bezier(.25,.46,.45,.94); }
.fill-blue { background: linear-gradient(90deg, #2563EB, #60A5FA); }
.fill-emerald { background: linear-gradient(90deg, #10B981, #34D399); }
.fill-purple { background: linear-gradient(90deg, #8B5CF6, #A78BFA); }
.fill-orange { background: linear-gradient(90deg, #F97316, #FB923C); }
.chart-card { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: border-color 0.3s ease, box-shadow 0.3s ease; animation: cardIn 0.6s ease both; }
.chart-card:hover { border-color: rgba(255,255,255,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.chart-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.chart-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
header { background: rgba(15,23,42,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
.header-scanline { height: 2px; background: linear-gradient(90deg, transparent, #2563EB, #06B6D4, #8B5CF6, transparent); background-size: 300% 100%; animation: scan 5s linear infinite; }
@keyframes scan { 0%{background-position:0%} 100%{background-position:-300%} }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); background: rgba(15,23,42,0.5); position: sticky; top: 0; }
.data-table td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
.row-analitico { background: rgba(139,92,246,0.07) !important; border-left: 3px solid rgba(139,92,246,0.6); }
.badge-analitico { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(139,92,246,0.1)); border: 1px solid rgba(139,92,246,0.5); color: #C4B5FD; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.badge-obs { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
.search-input { background: rgba(15,23,42,0.7); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-family: var(--mono); font-size: 12px; color: var(--text); width: 280px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.search-input:focus { border-color: rgba(37,99,235,0.5); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#dashboard { animation: fadeIn 0.4s ease; }
</style>
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<header>
  <div style="max-width:1400px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.3px">Centro de Control de Postes</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(37,99,235,0.2);border:1px solid rgba(37,99,235,0.4);color:#60A5FA;padding:2px 8px;border-radius:6px;font-weight:600">C2 · PRECARGADO</span>
      </div>
      <div id="subtitle" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">Sistema cargando datos...</div>
    </div>
  </div>
  <div class="header-scanline"></div>
</header>

<main style="max-width:1400px;margin:0 auto;padding:28px 24px;position:relative;z-index:1">

  <div id="dashboard">
    <!-- KPI CARDS -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:24px">
      <div class="kpi-card kpi-blue"><div class="kpi-icon">🗼</div><div class="kpi-label">Total Postes</div><div class="kpi-value" id="kpiTotalPostes">—</div></div>
      <div class="kpi-card kpi-emerald"><div class="kpi-icon">📈</div><div class="kpi-label">Avance Promedio</div><div class="kpi-value" id="kpiAvance">—</div></div>
      <div class="kpi-card kpi-purple"><div class="kpi-icon">🔬</div><div class="kpi-label">Con Analíticos</div><div class="kpi-value" id="kpiAnaliticos">—</div></div>
      <div class="kpi-card kpi-orange"><div class="kpi-icon">📋</div><div class="kpi-label">Observaciones</div><div class="kpi-value" id="kpiObs">—</div></div>
    </div>

    <!-- MAPA -->
    <div class="chart-card" style="margin-bottom:20px">
        <div class="chart-title">Mapa de Infraestructura</div>
        <div id="map" style="height:400px; width:100%; border-radius:12px; margin-top:10px;"></div>
    </div>

    <!-- TABLE -->
    <div class="chart-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div class="chart-title">Registro Detallado de Postes</div>
        <input class="search-input" id="tableSearch" type="text" placeholder="🔍 Buscar poste, dirección, observación…">
      </div>
      <div style="overflow-x:auto;max-height:480px;overflow-y:auto">
        <table class="data-table">
          <thead><tr><th>No.</th><th>Poste</th><th>Dirección</th><th>Progreso</th><th>Observaciones</th><th>Analíticos</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
// --- TU DATA ---
const data = [
  {"id": 1, "direccion": "Aztecas 46, San Bernabé Ocotepec, La Magdalena Contreras, CDMX", "coordenadas": "19.3171, -99.2621", "progreso": 75, "poste": "32", "observaciones": "PTZ fuera HV", "analiticos": null},
  {"id": 2, "direccion": "Progreso 21, San Nicolás Totolapan, La Magdalena Contreras, CDMX", "coordenadas": "19.3002, -99.2413", "progreso": 100, "poste": "16", "observaciones": "Funciona correctamente", "analiticos": null},
  {"id": 3, "direccion": "Luis Echeverría Álvarez MZ37LT14, La Magdalena Contreras, CDMX", "coordenadas": "19.3249, -99.2468", "progreso": 50, "poste": "45", "observaciones": "Bala fuera daño proveedor", "analiticos": "Lectora de placas"},
  {"id": 4, "direccion": "C. Oyametla 18, San Bernabé Ocotepec, La Magdalena Contreras, CDMX", "coordenadas": "19.3210, -99.2588", "progreso": 100, "poste": "38", "observaciones": "Funciona correctamente", "analiticos": null},
  {"id": 5, "direccion": "Lomas Tarumba 12, El Ocotal, La Magdalena Contreras, CDMX", "coordenadas": "19.2975, -99.2620", "progreso": 75, "poste": "44", "observaciones": "PTZ fuera HV", "analiticos": "Lectora de placas"}
];

// Inicializar Mapa
const map = L.map('map').setView([19.31, -99.24], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

// Renderizar marcadores
data.forEach(item => {
    const coords = item.coordenadas.split(',');
    if(coords.length === 2) {
        L.marker([parseFloat(coords[0]), parseFloat(coords[1])]).addTo(map)
         .bindPopup(`<b>Poste: ${item.poste}</b><br>${item.direccion}`);
    }
});

// Llenar tabla
const tbody = document.getElementById('tableBody');
data.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td style="color:#64748B">${r.id}</td>
        <td><span class="badge-obs" style="background:rgba(37,99,235,0.1)">${r.poste}</span></td>
        <td style="max-width:200px">${r.direccion}</td>
        <td>${r.progreso}%</td>
        <td>${r.observaciones}</td>
        <td>${r.analiticos ? '<span class="badge-analitico">'+r.analiticos+'</span>' : '—'}</td>
    `;
    tbody.appendChild(tr);
});

// KPIs
document.getElementById('kpiTotalPostes').textContent = data.length;
document.getElementById('kpiAvance').textContent = Math.round(data.reduce((a,b)=>a+b.progreso,0)/data.length) + "%";
document.getElementById('kpiAnaliticos').textContent = data.filter(d=>d.analiticos).length;
document.getElementById('kpiObs').textContent = data.filter(d=>d.observaciones && !d.observaciones.toLowerCase().includes('funciona')).length;
document.getElementById('subtitle').textContent = "Dashboard cargado con " + data.length + " registros.";

// Buscador
document.getElementById('tableSearch').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('#tableBody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
});
</script>

</body>
</html>
